# Deploy the dashboard to GitHub Pages on every push to main.
#
# The site is fully static: site/ already contains data/metrics.json, the
# per-chart CSVs, the SQL copies, self-hosted fonts and the vendored chart
# library, all regenerated by `make rebuild` and committed. So deployment is
# an upload, not a build - what you see at the Pages URL is byte-for-byte
# what is in the repository.
#
# One-time setup by the maintainer: repository Settings -> Pages -> Source:
# "GitHub Actions". Pages serves from public repositories on the free plan,
# so this activates once the repository is public.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
