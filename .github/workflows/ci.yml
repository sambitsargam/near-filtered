# Verification on every push: tests, the number-drift check, and a full
# rebuild from the committed aggregates. Needs no secrets, which is the
# point - this is the same command a judge runs.
name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.6"
      - run: make install
      - run: make verify
      # The committed documents must be exactly what the pipeline regenerates
      # from the committed data. A diff here means someone committed results
      # and prose out of step, or edited a generated file by hand.
      - run: git diff --exit-code -I '"generated_at_utc": ' -I '^\*\*Generated ' THESIS.md README.md results/metrics.json
